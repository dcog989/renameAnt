[workspace]
resolver = "3"
members = ["core", "gui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
repository = "https://github.com/Bubba/renameAnt"
license = "GPL-3.0-or-later"

[workspace.dependencies]
renameant-core = { path = "core" }

base64 = "0.23"
bstr = "1"
# No wgpu: host GL/EGL is enough. system_fonts: bundled fonts have no CJK.
eframe = {
  version = "0.37",
  default-features = false,
  features = [
    "default_fonts",
    "accesskit",
    "clipboard",
    "glow",
    "persistence",
    "system_fonts",
    "wayland",
    "x11",
  ]
}
egui = { version = "0.37", features = ["monochrome_emoji_fonts"] }
# Default features pull a mime guesser only the image loaders use; serde persists column widths.
egui_extras = { version = "0.37", default-features = false, features = ["serde"] }
regex = "1"
# Portal backend (rfd's default): no libgtk in the AppImage, only xdg-desktop-portal.
rfd = "0.18"
rustix = { version = "1", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
unicode-normalization = "0.1"
# eframe does not re-export winit's features: Wayland CSD, and dlopen'ing libwayland.
winit = {
  version = "0.30",
  default-features = false,
  features = [
    "wayland-csd-adwaita",
    "wayland-dlopen",
  ]
}

[profile.release]
opt-level = 3
strip = true
lto = "thin"
panic = "abort"
codegen-units = 1
