name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # rust-toolchain.toml pins the toolchain and its components; the runner's
      # rustup installs both on the first cargo invocation.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: rust-v1
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2
        with:
          tool: just
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libwayland-dev libxkbcommon-dev
      # A non-conventional message blocks `cog bump`, so catch it before merge.
      - name: Verify commit messages
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "no base commit to compare against"
            exit 0
          fi
          status=0
          while IFS= read -r message; do
            printf '%s\n' "$message" | grep -qE \
              '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([^)]*\))?!?: .+' || {
                echo "not conventional: $message" >&2
                status=1
              }
          done < <(git log --no-merges --format=%s "$BASE..HEAD")
          exit "$status"
      - run: just check

  # Builds the release profile and the AppImage, so a broken packaging step
  # fails here instead of after the tag exists. 22.04 keeps the AppImage's
  # glibc floor lower than the newest runner.
  package:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: rust-v1
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2
        with:
          tool: just
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libwayland-dev libxkbcommon-dev librsvg2-bin
      - name: Build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: just package
